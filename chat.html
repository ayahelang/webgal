<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081018">
  <title>Chat Angkatan — Silverhawk Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-skills">
  <div class="bg-grid"></div>
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">SH</span><span><b>Silverhawk</b><small>Student Web Gallery</small></span></a>
    <nav class="topnav">
      <a href="index.html">Gallery</a>
      <a href="submit.html">Input Alumni</a>
      <a href="chat.html" class="active">Chat</a>
          <a href="videos.html">Galeri Video</a>
      <a href="admin.html" class="nav-profile" title="Admin">👤</a>
    </nav>
  </header>
  <main class="skills-main">
    <section class="skills-hero">
      <div class="eyebrow">LIVE CHAT</div>
      <h1>Obrolan kenang-kenangan</h1>
      <p class="skills-lead">Per angkatan atau lintas angkatan. Ada indikator <b>sedang mengetik</b> dan avatar emoji.</p>
    </section>
    <div class="summary-card" style="display:grid;gap:12px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <label class="field"><span>Nama tampilan</span>
          <input id="chatName" type="text" maxlength="40" placeholder="Nama kamu">
        </label>
        <label class="field"><span>Avatar emoji</span>
          <select id="chatAvatar">
            <option>🎓</option><option>💬</option><option>🌟</option><option>🦋</option>
            <option>🌸</option><option>🚀</option><option>💜</option><option>🌙</option>
            <option>🔥</option><option>✨</option><option>🦊</option><option>🍀</option>
          </select>
        </label>
        <label class="field"><span>Ruang chat</span>
          <select id="chatRoom"></select>
        </label>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <div id="typingLine" class="typing-line" aria-live="polite"></div>
      <form id="chatForm" style="display:flex;gap:8px">
        <input id="chatInput" type="text" maxlength="1000" placeholder="Tulis pesan..." style="flex:1" autocomplete="off">
        <button class="btn btn-primary" type="submit">Kirim</button>
      </form>
      <p id="chatStatus" class="muted" style="margin:0;font-size:12px"></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/profile-status.js"></script>
  <script src="js/auth-ui.js"></script>

  <script src="js/chat.js"></script>
  <script src="js/stats-float.js"></script>
</body>
</html>
